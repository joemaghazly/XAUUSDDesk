<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>XAU/USD Journal — The Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap');

:root{
  --bg:#15130F; --panel:#1E1B16; --raise:#262119; --rule:#3A3229; --rule2:#2C2620;
  --text:#EDE6D6; --dim:#948A78; --faint:#6B6355;
  --azure:#4F8FD1; --jade:#7FA981; --clay:#C06B54;
  --disp:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;
  padding-bottom:70px;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 480px at 50% -140px, rgba(79,143,209,.10), transparent 70%)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.desknav{background:var(--panel);border-bottom:1px solid var(--rule2)}
.desknav-in{max-width:1120px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.desknav-in::-webkit-scrollbar{display:none}
.desknav-mark{font-family:var(--disp);font-weight:800;font-size:12.5px;letter-spacing:.02em;display:flex;align-items:center;gap:7px;
  margin-right:10px;color:var(--text);text-decoration:none;flex:none}
.desknav-mark .ingot{width:16px;height:10px}
.desknav-item{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  text-decoration:none;padding:7px 12px;border-radius:100px;white-space:nowrap;transition:color .15s,background .15s;flex:none}
.desknav-item:hover{color:var(--text)}
.desknav-item[data-here="1"]{color:var(--bg);background:var(--azure);font-weight:600}

:focus-visible{outline:2px solid var(--azure);outline-offset:3px;border-radius:2px}

.top{padding:26px 0 0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mark{font-family:var(--disp);font-weight:800;font-size:17px;display:flex;align-items:center;gap:9px}
.ingot{width:22px;height:13px;background:linear-gradient(150deg,#E8BC66,#B97F27);
  clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);border-radius:1px;flex:none}
.clock{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em}
.nav{display:flex;gap:6px;margin-top:20px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  padding:8px 14px;border:1px solid var(--rule2);border-radius:100px;color:var(--dim);white-space:nowrap;
  transition:color .16s,border-color .16s,background .16s}
.nav button:hover{color:var(--text);border-color:var(--rule)}
.nav button[data-on="1"]{color:var(--bg);background:var(--azure);border-color:var(--azure);font-weight:500}

.hero{position:relative;margin-top:24px;border:1px solid var(--rule2);border-radius:6px;
  background:linear-gradient(180deg,var(--panel),#191610);overflow:hidden}
.hero-in{position:relative;z-index:2;padding:26px 26px 0}
.hero-eye{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--azure)}
.hero-big{font-family:var(--mono);font-weight:500;font-size:clamp(44px,10vw,74px);line-height:.98;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:10px 0 2px}
.hero-unit{font-family:var(--disp);font-weight:500;font-size:15px;color:var(--dim)}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.chip{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--rule2);
  padding:4px 10px;border-radius:100px;background:rgba(0,0,0,.2)}
.chip b{color:var(--text);font-weight:500}
.hero-curve{display:block;width:100%;height:96px;margin-top:6px}
.winnav{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px}
.arrow{font-size:22px;line-height:1;color:var(--dim);border:1px solid var(--rule2);border-radius:100px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.arrow:hover:not([disabled]){color:var(--text);border-color:var(--dim)}
.arrow[disabled]{opacity:.28;cursor:default}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--faint);padding:0 2px 14px}
.hero-foot{position:relative;z-index:2;display:flex;flex-wrap:wrap;
  border-top:1px solid var(--rule2);background:rgba(0,0,0,.22)}
.hf{flex:1 1 120px;padding:14px 18px;border-right:1px solid var(--rule2)}
.hf:last-child{border-right:none}
.hf-k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.hf-v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;margin-top:3px}

.sect{padding:44px 0 0}
.eye{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--azure)}
h2{font-family:var(--disp);font-weight:700;font-size:29px;letter-spacing:-.02em;margin:8px 0 0}
h3{font-family:var(--disp);font-weight:700;font-size:19px;margin:8px 0 0}
.lede{font-size:13.5px;color:var(--dim);max-width:66ch;line-height:1.65;margin-top:9px}
.card{background:var(--panel);border:1px solid var(--rule2);border-radius:6px;padding:20px;margin-top:14px}

.score{margin-top:22px;border-top:1px solid var(--rule2)}
.row{padding:20px 0;border-bottom:1px solid var(--rule2)}
.row-head{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row-name{font-family:var(--disp);font-weight:700;font-size:15px}
.badge{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:100px;
  border:1px solid var(--rule);color:var(--dim);white-space:nowrap}
.badge[data-v="lead"]{color:var(--jade);border-color:rgba(127,169,129,.5);background:rgba(127,169,129,.08)}
.badge[data-v="thin"]{color:var(--azure);border-color:rgba(79,143,209,.45);background:rgba(79,143,209,.07)}
.dv{display:grid;grid-template-columns:1fr 12px 1fr;align-items:center}
.dv-side{display:flex;align-items:center;gap:11px;min-width:0}
.dv-side.r{flex-direction:row-reverse}
.dv-bar{flex:1;height:26px;display:flex}
.dv-side.l .dv-bar{justify-content:flex-end}
.dv-fill{height:100%;width:0;border-radius:2px;transition:width .8s cubic-bezier(.22,.75,.3,1)}
.dv-fill.pos{background:linear-gradient(90deg,rgba(127,169,129,.35),var(--jade))}
.dv-side.r .dv-fill.pos{background:linear-gradient(270deg,rgba(127,169,129,.35),var(--jade))}
.dv-fill.neg{background:linear-gradient(90deg,rgba(192,107,84,.35),var(--clay))}
.dv-side.r .dv-fill.neg{background:linear-gradient(270deg,rgba(192,107,84,.35),var(--clay))}
.dv-axis{height:34px;background:var(--rule);width:1px;margin:0 auto}
.dv-lab{flex:none;width:116px}
.dv-side.r .dv-lab{text-align:right}
.dv-nm{font-family:var(--disp);font-weight:500;font-size:13px;line-height:1.2}
.dv-n{font-family:var(--mono);font-size:10px;color:var(--faint)}
.dv-v{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;flex:none;width:64px}
.dv-side.r .dv-v{text-align:right}
.dv-sub{font-family:var(--mono);font-size:10px;color:var(--faint)}
.row-note{font-size:12.5px;color:var(--faint);line-height:1.6;margin-top:13px;text-align:center;max-width:64ch;margin:13px auto 0}

.brow{display:grid;grid-template-columns:128px 1fr 78px;gap:12px;align-items:center;margin-top:11px}
.blab{font-family:var(--mono);font-size:11px;color:var(--dim)}
.btrack{height:10px;background:var(--raise);border-radius:2px;position:relative;overflow:hidden}
.bzero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rule)}
.bfill{position:absolute;top:0;bottom:0;width:0;transition:width .8s cubic-bezier(.22,.75,.3,1)}
.bfill.pos{left:50%;background:var(--jade)}
.bfill.neg{right:50%;background:var(--clay)}
.bval{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.pos{color:var(--jade)} .neg{color:var(--clay)} .dimc{color:var(--dim)}

.scroll{overflow-x:auto;margin-top:16px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  text-align:left;font-weight:500;padding:10px 11px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:11px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tbody tr:hover{background:var(--panel)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
.right{text-align:right}
.tag{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--rule2);
  padding:2px 7px;border-radius:100px;white-space:nowrap;display:inline-block}
.tag.bad{color:var(--clay);border-color:rgba(192,107,84,.4)}

.pills{display:flex;gap:7px;margin-top:18px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 15px;border:1px solid var(--rule2);border-radius:100px;color:var(--dim)}
.pill[data-on="1"]{color:var(--bg);background:var(--azure);border-color:var(--azure)}
.pill:hover{color:var(--text)} .pill[data-on="1"]:hover{color:var(--bg)}

.drop{border:1.5px dashed var(--rule);border-radius:8px;padding:36px 24px;text-align:center;
  margin-top:18px;background:var(--panel);transition:border-color .2s,background .2s}
.drop.over{border-color:var(--azure);background:rgba(79,143,209,.07)}
.drop h3{margin:0 0 8px}
.drop p{color:var(--dim);font-size:13.5px;max-width:52ch;margin:0 auto 20px;line-height:1.6}

.acts{display:flex;gap:11px;align-items:center;margin-top:22px;flex-wrap:wrap;justify-content:center}
.acts.l{justify-content:flex-start}
.btn{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--azure);color:#15130F;padding:13px 24px;border-radius:4px;font-weight:600;transition:filter .15s}
.btn:hover{filter:brightness(1.09)}
.btn.g{background:none;color:var(--dim);border:1px solid var(--rule);font-weight:400}
.btn.g:hover{color:var(--text);border-color:var(--dim);filter:none}
.btn.d{background:none;color:var(--clay);border:1px solid rgba(192,107,84,.45);font-weight:400}
.link{color:var(--azure);font-family:var(--mono);font-size:12px;text-decoration:underline;padding:0}
.link.warn{color:var(--clay)}

.note{font-family:var(--mono);font-size:11.5px;padding:11px 14px;border-radius:4px;margin-top:16px;
  border:1px solid rgba(79,143,209,.4);color:var(--azure);background:rgba(79,143,209,.06);
  display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.note.bad{border-color:rgba(192,107,84,.45);color:var(--clay);background:rgba(192,107,84,.06)}
.note.ok{border-color:rgba(127,169,129,.45);color:var(--jade);background:rgba(127,169,129,.06)}

.empty{padding:60px 20px;text-align:center}
.empty h3{font-size:23px;margin-bottom:10px}
.empty p{color:var(--dim);font-size:14px;max-width:48ch;margin:0 auto 26px;line-height:1.65}
.foot{margin-top:52px;padding-top:20px;border-top:1px solid var(--rule2);
  font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.9}
.daynote{font-size:13px;color:var(--dim);line-height:1.65;margin-top:10px}

.app-shell{display:flex;align-items:flex-start;max-width:1120px;margin:0 auto;gap:0}
.app-shell .app-main{flex:1;min-width:0}
.app-shell .wrap{max-width:none;margin:0;padding:0 22px}
.sidebar{flex:none;width:186px;padding:26px 14px 26px 0;position:sticky;top:0;align-self:flex-start}
.side-nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.side-item{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);text-align:left;padding:9px 12px;border-radius:5px;transition:color .15s,background .15s;white-space:nowrap}
.side-item:hover{color:var(--text);background:var(--panel)}
.side-item[data-on="1"]{color:var(--bg);background:var(--azure);font-weight:600}
.side-bottom{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule2);display:flex;flex-direction:column;gap:2px}
.side-bottom .side-item{color:var(--faint)}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.crumb b{color:var(--dim);font-weight:500}

.lock-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:50;background-image:radial-gradient(1100px 480px at 50% -140px, rgba(79,143,209,.10), transparent 70%)}
.lock-overlay[hidden]{display:none}
.lock-card{width:100%;max-width:320px;text-align:center}
.lock-mark{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--azure);margin-bottom:18px}
.lock-card h2{font-size:22px}
.lock-card p{color:var(--dim);font-size:13px;margin-top:8px;line-height:1.6}
.lock-input{width:100%;margin-top:20px;background:var(--panel);border:1px solid var(--rule2);border-radius:6px;
  padding:14px;text-align:center;font-family:var(--mono);font-size:20px;letter-spacing:.4em;color:var(--text)}
.lock-input::placeholder{letter-spacing:.4em}
.lock-input:focus{outline:2px solid var(--azure);outline-offset:2px;border-color:var(--azure)}
.lock-err{color:var(--clay);font-family:var(--mono);font-size:11.5px;margin-top:10px}
.lock-acts{margin-top:18px;display:flex;flex-direction:column;gap:10px;align-items:center}

.edge-wrap{display:flex;gap:32px;flex-wrap:wrap;align-items:center;justify-content:center;padding:6px 0}
.radar-svg{width:280px;max-width:100%;height:auto;flex:none;overflow:visible}
.edge-score-box{flex:1 1 180px;max-width:220px;text-align:center}
.edge-score-num{font-family:var(--mono);font-weight:500;font-size:44px;color:var(--azure);letter-spacing:-.02em}
.escore-bar{height:8px;border-radius:100px;background:linear-gradient(90deg,var(--clay),var(--jade));position:relative;margin-top:14px}
.escore-dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--text);border:2px solid var(--bg);transform:translate(-50%,-50%)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid.cal-head{margin-bottom:2px}
.cal-dow{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:4px}
.cal-cell{aspect-ratio:1;border-radius:4px;border:1px solid var(--rule2);padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cal-cell.cal-off{border-color:transparent}
.cal-d{font-family:var(--mono);font-size:10px;color:var(--faint)}
.cal-v{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;align-self:flex-end}

.acc-row{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:center;margin-top:12px}
.acc-row:first-child{margin-top:0}
.acc-input{background:var(--raise);border:1px solid var(--rule2);border-radius:4px;padding:10px 12px;
  font-family:var(--mono);color:var(--text);font-size:13px;width:100%;max-width:220px}
.acc-input:focus{outline:2px solid var(--azure);outline-offset:1px;border-color:var(--azure)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.form-grid .full{grid-column:1/-1}
.f-field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.f-field input,.f-field select,.f-field textarea{width:100%;background:var(--raise);border:1px solid var(--rule2);border-radius:4px;
  padding:10px 12px;font-family:var(--body);color:var(--text);font-size:13.5px}
.f-field input:focus,.f-field select:focus,.f-field textarea:focus{outline:2px solid var(--azure);outline-offset:1px;border-color:var(--azure)}
.f-field textarea{resize:vertical;min-height:80px;font-family:var(--body)}
.f-field.chk{display:flex;align-items:center;gap:8px;margin-top:2px}
.f-field.chk input{width:auto}

.jlist{margin-top:16px;display:flex;flex-direction:column}
.jcard{padding:16px 4px;border-bottom:1px solid var(--rule2)}
.jc-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.jc-pts{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;font-weight:500;min-width:60px}
.jc-why{font-size:13px;color:var(--dim);line-height:1.6;margin-top:8px;max-width:78ch}
.jc-why b{color:var(--text);font-weight:500}
.jc-foot{display:flex;gap:16px;margin-top:10px;justify-content:flex-end}

@media (max-width:860px){
  .grid2{grid-template-columns:1fr;gap:26px}
  .dv{grid-template-columns:1fr}
  .dv-axis{display:none}
  .dv-side.r{flex-direction:row}
  .dv-side.r .dv-bar{justify-content:flex-start}
  .dv-side.r .dv-lab,.dv-side.r .dv-v{text-align:left}
  .dv-side.r .dv-fill.pos{background:linear-gradient(90deg,rgba(127,169,129,.35),var(--jade))}
  .dv-side.r .dv-fill.neg{background:linear-gradient(90deg,rgba(192,107,84,.35),var(--clay))}
  .dv-side{margin-top:9px}
  .hero-in{padding:22px 20px 0}
  h2{font-size:25px}
  .app-shell{display:block}
  .sidebar{position:static;width:auto;padding:0 0 14px;border-bottom:1px solid var(--rule2);margin-bottom:6px}
  .side-nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .side-nav::-webkit-scrollbar{display:none}
  .side-item{flex:none}
  .side-bottom{flex-direction:row;border-top:none;margin-top:8px;padding-top:0;gap:10px}
  .form-grid{grid-template-columns:1fr}
  .acc-row{grid-template-columns:1fr}
  .edge-wrap{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){ .dv-fill,.bfill{transition:none} }
</style>
</head>
<body>
<div class="desknav"><div class="desknav-in">
  <a href="index.html" class="desknav-mark"><span class="ingot"></span>THE DESK</a>
  <a href="lab.html" class="desknav-item" data-here="0">Lab</a>
  <a href="indicators.html" class="desknav-item" data-here="0">Indicators</a>
  <a href="journal.html" class="desknav-item" data-here="1">Journal</a>
  <a href="session-board.html" class="desknav-item" data-here="0">Session Board</a>
</div></div>

<div class="app-shell" id="appShell">
  <aside class="sidebar">
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-bottom">
      <button class="side-item" data-act="lock">Lock</button>
      <button class="side-item" data-act="signout">Sign out</button>
    </div>
  </aside>
  <div class="app-main">
    <div class="wrap">
      <header class="top">
        <div class="toprow">
          <div class="mark"><span class="ingot"></span>XAU/USD Journal</div>
          <div class="clock" id="clock">Beirut UTC+3</div>
        </div>
        <div class="crumb" id="crumb"></div>
      </header>
      <div id="banners"></div>
      <main id="view"></main>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>
<div class="lock-overlay" id="lockOverlay" hidden></div>
<input type="file" id="filepick" accept=".xlsx,.xlsm,.xls" style="position:fixed;left:-9999px">
<input type="file" id="backuppick" accept=".json" style="position:fixed;left:-9999px">

<script>
(function () {
  "use strict";

  var SYMBOL = "XAUUSD";
  var KEY = "xauusd-desk:trades:" + SYMBOL;
  var LEGACY_KEYS = ["xauusd-journal-v3", "session-board-history"];
  var PIN_KEY = "xauusd-desk:pin:" + SYMBOL;
  var PIN_SKIP_KEY = "xauusd-desk:pin-skip:" + SYMBOL;
  var UNLOCK_KEY = "xauusd-desk:unlocked:" + SYMBOL; // sessionStorage — one unlock per browser tab session
  var ACC_KEY = "xauusd-desk:account:" + SYMBOL;
  var REV_KEY = "xauusd-desk:reviews:" + SYMBOL;
  var PLAYBOOK_KEY = "xauusd-desk:playbook:" + SYMBOL;
  var CERT_KEY = "xauusd-desk:certificates:" + SYMBOL;
  var EXP_KEY = "xauusd-desk:expenses:" + SYMBOL;
  var SESSIONS = ["Asia","London","NY"];
  var SETUPS = ["Continuation","Reversal","Other"];
  var DIRECTIONS = ["Long","Short"];
  var DAY_TYPES = ["Compression","Normal","Stretched","Extended"];
  var DAY_CHARS = ["Trending Bullish Day","Trending Bearish Day","Choppy Day","Reversal Day"];
  var EXP_CATS = ["Data feed","Platform / software","Challenge fee","Other"];
  var NAV_ITEMS = [
    ["dashboard","Dashboard"], ["accounts","Accounts"], ["addtrade","Add trade"],
    ["journal","Journal"], ["review","Review"], ["playbook","Playbook"],
    ["breakdown","Breakdown"], ["certificates","Certificates"], ["expenses","Expenses"],
    ["data","Import / export"]
  ];

  /* Column order matches the Trade Log sheet exactly, so export round-trips. */
  var SHEET_COLS = [
    ["date","Date"], ["tradeNo","Trade #\n(of day)"], ["session","Session"], ["dayType","Day Type"],
    ["dayChar","Day\nCharacter"], ["asianHigh","Asian High"], ["asianLow","Asian Low"], ["atr","Daily ATR"],
    ["asianRange","Asian Range\n(pts)"], ["asianPctATR","Asian Range\n% of ATR"], ["dayPctATR","Day Range\n% ATR\n(at entry)"],
    ["setup","Setup Type"], ["direction","Direction"], ["rsi","RSI\nat Entry"],
    ["entry1","Entry\nBullet 1"], ["entry2","Entry\nBullet 2"], ["sl","Stop Loss"], ["risk1R","Risk 1R\n(Bullet 1, pts)"],
    ["tp1","TP1\n(Bullet 1)"], ["tp2","TP2\n(Bullet 2)"], ["exit1","Exit\nBullet 1"], ["exit2","Exit\nBullet 2"],
    ["res1","Result\nBullet 1 (pts)"], ["res2","Result\nBullet 2 (pts)"], ["totalPts","Total Result\n(pts)"],
    ["resR","Result\n(R)"], ["ruleBroken","Rule\nBroken?"], ["confluence","Confluence / Setup Notes"],
    ["notes","Notes / Lessons"], ["h1State","1H State\nat Entry"]
  ];
  var DAY_COLS = [
    ["date","Date"],["dayNo","Day #"],["asianHigh","Asian High"],["asianLow","Asian Low"],["atr","Daily ATR"],
    ["asianPctATR","Asian Range\n% of ATR"],["dayType","Day Type"],["dayChar","Day\nCharacter"],
    ["tradesTaken","Trades\nTaken"],["notes","Notes / What Happened"]
  ];

  var state = { trades: [], days: [], tab: "dashboard", period: "daily", view: "daily", offset: 0,
                msg: null, msgKind: "", imported: null, confirmClear: false,
                pinLocked: false, pinStage: "gate", pinError: "", confirmPinReset: false,
                breakdownSub: "periods", calOffset: 0, reviewOffset: 0,
                account: { startingBalance: 0, pointValue: 1 },
                reviews: {}, playbookNotes: {}, certificates: [], expenses: [],
                editingId: null, confirmDeleteId: null };

  /* ---------------- utils ---------------- */
  function n(v){ var x = typeof v==="number" ? v : parseFloat(v); return isFinite(x) ? x : 0; }
  /* Non-cryptographic — this is a browser-local convenience lock, not real auth. */
  function simpleHash(s){ s=String(s); var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return String(h); }
  function has(v){ return v!==null && v!==undefined && v!==""; }
  function fmt(v,d){ d=d===undefined?1:d; return (v>0?"+":"") + v.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function cls(v){ return v>0?"pos":v<0?"neg":"dimc"; }
  function say(m,k){ state.msg=m; state.msgKind=k||""; }
  function pts(t){ return n(t.totalPts); }
  function R(t){ return n(t.resR); }
  function sorted(){
    return state.trades.slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return n(a.tradeNo)-n(b.tradeNo);
    });
  }
  function agg(list){
    var c=list.length;
    var p=list.reduce(function(s,t){return s+pts(t);},0);
    var r=list.reduce(function(s,t){return s+R(t);},0);
    var w=list.filter(function(t){return pts(t)>0;}).length;
    return { n:c, pts:p, R:r, wins:w, losses:list.filter(function(t){return pts(t)<0;}).length,
             avg:c?p/c:0, avgR:c?r/c:0, wr:c?w/c*100:0 };
  }
  function perfStats(list){
    var winners=list.filter(function(t){return pts(t)>0;});
    var losers=list.filter(function(t){return pts(t)<0;});
    var grossWin=winners.reduce(function(s,t){return s+pts(t);},0);
    var grossLoss=losers.reduce(function(s,t){return s+pts(t);},0); // negative or 0
    var pf = grossLoss<0 ? grossWin/Math.abs(grossLoss) : (grossWin>0 ? Infinity : null);
    var avgWinner = winners.length ? grossWin/winners.length : null;
    var avgLoser  = losers.length  ? grossLoss/losers.length  : null;
    var chron=list.slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return n(a.tradeNo)-n(b.tradeNo);
    });
    var run=0, peak=0, maxDD=0;
    chron.forEach(function(t){ run+=pts(t); if(run>peak) peak=run; var dd=peak-run; if(dd>maxDD) maxDD=dd; });
    var allPts=list.map(pts);
    return {
      pf:pf, avgWinner:avgWinner, avgLoser:avgLoser, maxDD:maxDD,
      best: allPts.length?Math.max.apply(null,allPts):null,
      worst: allPts.length?Math.min.apply(null,allPts):null,
      winnersN:winners.length, losersN:losers.length
    };
  }
  function toISO(v){
    if(!has(v)) return "";
    if(typeof v==="number"){ var d=new Date(Math.round((v-25569)*86400000)); return d.toISOString().slice(0,10); }
    var s=String(v).trim();
    var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
    var d2=new Date(s); if(!isNaN(d2.getTime())) return d2.toISOString().slice(0,10);
    return s;
  }
  function norm(h){ return String(h==null?"":h).replace(/\s+/g," ").trim().toLowerCase(); }

  /* ---------------- storage ----------------
     Trade history now lives under one shared key per symbol, so the
     Journal and the Session Board's suggestion cards read the same
     data — importing on either page updates both. Older browsers may
     still have data under the pre-merge keys; adopt it once, then
     write it back under the shared key so every page agrees after that. */
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){ var p=JSON.parse(raw);
        state.trades=Array.isArray(p.trades)?p.trades:[];
        state.days=Array.isArray(p.days)?p.days:[];
        return;
      }
      for(var i=0;i<LEGACY_KEYS.length;i++){
        var old=localStorage.getItem(LEGACY_KEYS[i]);
        if(!old) continue;
        var op=JSON.parse(old);
        if(Array.isArray(op.trades) && op.trades.length){
          state.trades=op.trades; state.days=Array.isArray(op.days)?op.days:[];
          persist();
          say("Brought forward "+state.trades.length+" trades saved earlier under a separate key.","ok");
          return;
        }
      }
    }catch(e){ say("Couldn't read saved data in this browser.","bad"); }
  }
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify({trades:state.trades, days:state.days})); }
    catch(e){ say("Storage is blocked here — the import won't survive a reload.","bad"); }
    render();
  }
  function loadAccount(){
    try{
      var raw=localStorage.getItem(ACC_KEY);
      if(raw){ var p=JSON.parse(raw);
        state.account={ startingBalance:n(p.startingBalance), pointValue: has(p.pointValue)?n(p.pointValue):1 };
      }
    }catch(e){}
  }
  function persistAccount(){
    try{ localStorage.setItem(ACC_KEY, JSON.stringify(state.account)); }catch(e){}
  }
  function loadJSON(key,fallback){
    try{ var raw=localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){}
    return fallback;
  }
  function saveJSON(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
  function loadExtras(){
    state.reviews=loadJSON(REV_KEY,{});
    state.playbookNotes=loadJSON(PLAYBOOK_KEY,{});
    state.certificates=loadJSON(CERT_KEY,[]);
    state.expenses=loadJSON(EXP_KEY,[]);
  }

  /* ---------------- xlsx import ---------------- */
  function readWorkbook(file){
    if(typeof XLSX==="undefined"){
      say("The spreadsheet reader didn't load. Check your connection and reload the page.","bad"); render(); return;
    }
    var fr=new FileReader();
    fr.onerror=function(){ say("Couldn't read that file.","bad"); render(); };
    fr.onload=function(ev){
      try{
        var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        var res=parseWorkbook(wb);
        if(!res.trades.length){
          say("No trade rows found. Expecting a sheet named Trade Log with a Date column in its header row.","bad");
          render(); return;
        }
        state.trades=res.trades; state.days=res.days;
        state.imported={ file:file.name, when:new Date().toLocaleString(), trades:res.trades.length,
                         days:res.days.length, skipped:res.skipped, sheets:wb.SheetNames.join(", ") };
        state.tab="dashboard";
        say("Imported "+res.trades.length+" trades and "+res.days.length+" day records from "+file.name+".","ok");
        persist();
      }catch(err){
        say("Import failed: "+(err&&err.message?err.message:err),"bad"); render();
      }
    };
    fr.readAsArrayBuffer(file);
  }

  function findSheet(wb, wanted){
    for(var i=0;i<wb.SheetNames.length;i++){
      if(norm(wb.SheetNames[i])===norm(wanted)) return wb.Sheets[wb.SheetNames[i]];
    }
    return null;
  }
  function gridOf(ws){ return ws ? XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}) : []; }

  /* Locate the header row by finding "date" in the first few columns. */
  function headerIndex(grid){
    for(var i=0;i<Math.min(grid.length,15);i++){
      var row=grid[i]||[];
      for(var j=0;j<Math.min(row.length,4);j++){
        if(norm(row[j])==="date") return i;
      }
    }
    return -1;
  }
  function mapRow(row, hdr, spec){
    var out={};
    spec.forEach(function(pair){
      var target=norm(pair[1]);
      var idx=hdr.indexOf(target);
      out[pair[0]] = idx>-1 ? row[idx] : null;
    });
    return out;
  }

  function parseWorkbook(wb){
    var out={trades:[],days:[],skipped:0};

    var tg=gridOf(findSheet(wb,"Trade Log"));
    if(!tg.length){ // fall back to the first sheet that has a Date header
      for(var i=0;i<wb.SheetNames.length;i++){
        var g=gridOf(wb.Sheets[wb.SheetNames[i]]);
        if(headerIndex(g)>-1){ tg=g; break; }
      }
    }
    var hi=headerIndex(tg);
    if(hi>-1){
      var hdr=(tg[hi]||[]).map(norm);
      for(var r=hi+1;r<tg.length;r++){
        var row=tg[r]||[];
        if(!has(row[hdr.indexOf("date")>-1?hdr.indexOf("date"):0])) { continue; }
        var rec=mapRow(row,hdr,SHEET_COLS);
        rec.date=toISO(rec.date);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(rec.date)){ out.skipped++; continue; }
        // Recompute the total if the sheet left it blank but has both bullets.
        if(!has(rec.totalPts) && (has(rec.res1)||has(rec.res2))) rec.totalPts=n(rec.res1)+n(rec.res2);
        rec.id="x"+r+"-"+rec.date;
        out.trades.push(rec);
      }
    }

    var dg=gridOf(findSheet(wb,"Day Log"));
    var dhi=headerIndex(dg);
    if(dhi>-1){
      var dhdr=(dg[dhi]||[]).map(norm);
      for(var q=dhi+1;q<dg.length;q++){
        var drow=dg[q]||[];
        var d=mapRow(drow,dhdr,DAY_COLS);
        d.date=toISO(d.date);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)) continue;
        out.days.push(d);
      }
    }
    return out;
  }

  /* ---------------- export ---------------- */
  function tradeAOA(){
    var rows=[["XAUUSD Day-Trading Journal — Joseph"],
              ["Exported from the dashboard. Column order matches the Trade Log sheet."],
              [], SHEET_COLS.map(function(c){ return c[1]; }), []];
    sorted().forEach(function(t){ rows.push(SHEET_COLS.map(function(c){ 
      var v=t[c[0]]; return v===null||v===undefined?"":v; })); });
    return rows;
  }
  function exportXlsx(){
    if(typeof XLSX==="undefined"){ say("The spreadsheet writer didn't load. Use CSV instead.","bad"); render(); return; }
    try{
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tradeAOA()), "Trade Log");
      if(state.days.length){
        var d=[DAY_COLS.map(function(c){return c[1];})];
        state.days.forEach(function(x){ d.push(DAY_COLS.map(function(c){ 
          var v=x[c[0]]; return v===null||v===undefined?"":v; })); });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(d), "Day Log");
      }
      XLSX.writeFile(wb, "XAUUSD_Trading_Journal_export.xlsx");
      say("Exported XAUUSD_Trading_Journal_export.xlsx to your downloads.","ok");
    }catch(e){ say("Export failed: "+(e&&e.message?e.message:e),"bad"); }
    render();
  }
  function csvText(){
    var q=function(v){ return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'; };
    var rows=[SHEET_COLS.map(function(c){ return q(c[1].replace(/\n/g," ")); }).join(",")];
    sorted().forEach(function(t){ rows.push(SHEET_COLS.map(function(c){ return q(t[c[0]]); }).join(",")); });
    return rows.join("\r\n");
  }
  /* ---------------- JSON backup (round-trips tags/account, unlike the xlsx export) ---------------- */
  function backupJSON(){
    var payload={ trades: state.trades, days: state.days, account: state.account, exportedAt: new Date().toISOString() };
    download("XAUUSD_Journal_backup.json", JSON.stringify(payload,null,2), "application/json");
  }
  function readBackup(file){
    var fr=new FileReader();
    fr.onerror=function(){ say("Couldn't read that file.","bad"); render(); };
    fr.onload=function(ev){
      try{
        var p=JSON.parse(ev.target.result);
        if(!Array.isArray(p.trades)) throw new Error("No trades array in that file.");
        state.trades=p.trades; state.days=Array.isArray(p.days)?p.days:[];
        if(p.account && typeof p.account==="object"){
          state.account={ startingBalance:n(p.account.startingBalance), pointValue: has(p.account.pointValue)?n(p.account.pointValue):1 };
          persistAccount();
        }
        say("Restored "+state.trades.length+" trades from backup.","ok");
        persist();
      }catch(err){ say("Restore failed: "+(err&&err.message?err.message:err),"bad"); render(); }
    };
    fr.readAsText(file);
  }
  function download(name,text,mime){
    try{
      var blob=new Blob([mime.indexOf("csv")>-1?"\uFEFF"+text:text],{type:mime+";charset=utf-8"});
      var url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download=name; a.style.display="none";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },1200);
      say("Saved "+name+" to your downloads.","ok");
    }catch(e){ say("Download blocked here — copy the text instead.","bad"); }
    render();
  }
  function copyText(text,label){
    var ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    ta.remove();
    if(ok){ say(label+" copied.","ok"); render(); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(function(){ say(label+" copied.","ok"); render(); },
        function(){ say("Copy blocked. Select the text and copy manually.","bad"); render(); });
    else { say("Copy blocked. Select the text and copy manually.","bad"); render(); }
  }

  /* ---------------- analytics ---------------- */
  function comparisons(){
    var T=state.trades;
    function c(label,an,af,bn,bf,note){
      var A=agg(T.filter(af)), B=agg(T.filter(bf)); A.name=an; B.name=bn;
      return {label:label,note:note,a:A,b:B};
    }
    var yes=function(t){ return String(t.ruleBroken||"").toUpperCase().indexOf("Y")===0; };
    return [
      c("Rules followed","Followed",function(t){return !yes(t);},"Broken",yes,
        "Straight from the Rule Broken column. If the followed side isn't clearly ahead, the rules aren't earning their keep."),
      c("Setup type","Continuation",function(t){return t.setup==="Continuation";},"Reversal",function(t){return t.setup==="Reversal";},
        "\u201cOther\u201d trades sit outside this split — they show up in the setup table below."),
      c("Trade number in the day","1st or 2nd",function(t){return n(t.tradeNo)<=2;},"3rd or later",function(t){return n(t.tradeNo)>=3;},
        "Whether the back end of the daily budget is worth spending."),
      c("Session",  "London",function(t){return t.session==="London";},"New York",function(t){return t.session==="NY";},
        "Only rows with the Session column filled in are counted here."),
      c("Direction","Long",function(t){return t.direction==="Long";},"Short",function(t){return t.direction==="Short";},""),
      c("RSI at entry","Stretched (\u226435 or \u226570)",function(t){return has(t.rsi)&&(n(t.rsi)<=35||n(t.rsi)>=70);},
        "Middle (36\u201369)",function(t){return has(t.rsi)&&n(t.rsi)>35&&n(t.rsi)<70;},
        "Entering while RSI is already at an extreme, versus entering from the middle of the range.")
    ];
  }
  function groupBy(field){
    var map={};
    state.trades.forEach(function(t){
      var k=has(t[field])?String(t[field]):"(blank)";
      (map[k]=map[k]||[]).push(t);
    });
    return Object.keys(map).map(function(k){ var a=agg(map[k]); a.name=k; return a; })
      .sort(function(x,y){ return y.n-x.n; });
  }

  function mondayOf(ds){ var d=new Date(ds+"T00:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.toISOString().slice(0,10); }
  function pKey(ds,m){ return m==="daily"?ds : m==="weekly"?mondayOf(ds) : ds.slice(0,7); }
  function pLabel(k,m){
    if(m==="daily") return new Date(k+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    if(m==="weekly"){ var s=new Date(k+"T00:00:00"), e=new Date(s); e.setDate(s.getDate()+6);
      return s.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" – "+e.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
    return new Date(k+"-01T00:00:00").toLocaleDateString(undefined,{month:"long",year:"numeric"});
  }
  function periods(m){
    var map={};
    sorted().forEach(function(t){ var k=pKey(t.date,m); (map[k]=map[k]||[]).push(t); });
    return Object.keys(map).sort().map(function(k){
      var list=map[k], a=agg(list), tots=list.map(pts), dd={};
      list.forEach(function(t){ dd[t.date]=1; });
      var broken=list.filter(function(t){ return String(t.ruleBroken||"").toUpperCase().indexOf("Y")===0; }).length;
      return { key:k, label:pLabel(k,m), n:a.n, pts:a.pts, R:a.R, avg:a.avg, wr:a.wr, wins:a.wins, losses:a.losses,
               broken:broken, best:Math.max.apply(null,tots), worst:Math.min.apply(null,tots),
               days:Object.keys(dd).length, list:list };
    });
  }

  /* ---------------- view pieces ---------------- */
  function bar(v,scale){
    var pct=scale?Math.min(50,Math.abs(v)/scale*50):0;
    return '<div class="btrack"><div class="bzero"></div><div class="bfill '+(v>=0?"pos":"neg")+'" data-w="'+pct+'"></div></div>';
  }
  function sparkline(vals,w,h,stroke){
    if(!vals.length) return "";
    var pad=2, mn=Math.min.apply(null,[0].concat(vals)), mx=Math.max.apply(null,[0].concat(vals));
    var span=(mx-mn)||1;
    var X=function(i){ return pad+(i/Math.max(1,vals.length-1))*(w-pad*2); };
    var Y=function(v){ return h-pad-((v-mn)/span)*(h-pad*2); };
    var line=vals.map(function(v,i){ return X(i)+","+Y(v); }).join(" ");
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" class="hero-curve" role="img" aria-label="Cumulative points">'+
      '<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+stroke+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+stroke+'" stop-opacity="0"/></linearGradient></defs>'+
      '<polygon points="'+X(0)+','+h+' '+line+' '+X(vals.length-1)+','+h+'" fill="url(#gf)"/>'+
      '<line x1="'+pad+'" x2="'+(w-pad)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#3A3229" vector-effect="non-scaling-stroke"/>'+
      '<polyline points="'+line+'" fill="none" stroke="'+stroke+'" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
      '<circle cx="'+X(vals.length-1)+'" cy="'+Y(vals[vals.length-1])+'" r="3.2" fill="#4F8FD1" vector-effect="non-scaling-stroke"/></svg>';
  }
  function hf(k,v,c){ return '<div class="hf"><div class="hf-k">'+esc(k)+'</div><div class="hf-v '+(c||"")+'">'+esc(v)+"</div></div>"; }
  function dvSide(s,scale,side){
    var pct=s.n?Math.min(100,Math.abs(s.avg)/scale*100):0;
    return '<div class="dv-side '+side+'">'+
      '<div class="dv-lab"><div class="dv-nm">'+esc(s.name)+'</div><div class="dv-n">n='+s.n+" · "+s.wr.toFixed(0)+"% win</div></div>"+
      '<div class="dv-v '+cls(s.avg)+'">'+(s.n?fmt(s.avg):"—")+'<div class="dv-sub">'+(s.n?fmt(s.avgR,2)+"R":"")+"</div></div>"+
      '<div class="dv-bar"><div class="dv-fill '+(s.avg>=0?"pos":"neg")+'" data-w="'+pct+'"></div></div></div>';
  }

  /* ---------------- edge score, calendar, balance/drawdown ---------------- */
  function money(v){
    var s=Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:2});
    return (v<0?"-$":"$")+s;
  }
  /* Heuristic 0-100 composite over six axes, always the full log (same rule as Performance above) —
     a summary of shape, not a prediction. Each axis is clamped independently, then averaged. */
  function edgeScore(){
    var list=state.trades;
    var o=agg(list), ps=perfStats(list);
    var grossWin=list.filter(function(t){return pts(t)>0;}).reduce(function(s,t){return s+pts(t);},0);

    var daily=periods("daily").map(function(p){return p.pts;});
    var consistency=50;
    if(daily.length>=2){
      var mean=daily.reduce(function(s,v){return s+v;},0)/daily.length;
      var sd=Math.sqrt(daily.reduce(function(s,v){return s+(v-mean)*(v-mean);},0)/daily.length);
      var scale=daily.reduce(function(s,v){return s+Math.abs(v);},0)/daily.length || 1;
      consistency=Math.max(0,100-Math.min(100,(sd/scale)*60));
    }
    var ddScore = grossWin>0 ? Math.max(0,100*(1-ps.maxDD/grossWin)) : (ps.maxDD>0?0:50);
    var payoff = (ps.avgWinner!=null && ps.avgLoser) ? ps.avgWinner/Math.abs(ps.avgLoser) : null;
    var payoffScore = payoff!=null ? Math.min(100,payoff/2.5*100) : 50;
    var recovery = ps.maxDD>0 ? o.pts/ps.maxDD : (o.pts>0?3:0);
    var recoveryScore = Math.max(0,Math.min(100,recovery/3*100));
    var pfScore = ps.pf===Infinity?100 : ps.pf==null?0 : Math.min(100,ps.pf/3*100);

    var axes=[
      {name:"Win %", score:o.n?o.wr:0},
      {name:"Profit factor", score:pfScore},
      {name:"Consistency", score:consistency},
      {name:"Max drawdown", score:ddScore},
      {name:"Avg win/loss", score:payoffScore},
      {name:"Recovery factor", score:recoveryScore}
    ];
    var overall=axes.reduce(function(s,a){return s+a.score;},0)/axes.length;
    return {axes:axes, overall:overall};
  }
  function radarChart(axes,size){
    var cx=size/2, cy=size/2, maxR=size/2-36, N=axes.length;
    function pt(i,r){ var ang=(-90+i*(360/N))*Math.PI/180; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)]; }
    var rings=[0.25,0.5,0.75,1].map(function(f){
      var pp=[]; for(var i=0;i<N;i++){ var p=pt(i,maxR*f); pp.push(p[0]+","+p[1]); }
      return '<polygon points="'+pp.join(" ")+'" fill="none" stroke="#3A3229" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }).join("");
    var spokes=axes.map(function(a,i){
      var p=pt(i,maxR);
      return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#3A3229" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }).join("");
    var dataPts=axes.map(function(a,i){ var p=pt(i,maxR*Math.max(0,Math.min(100,a.score))/100); return p[0]+","+p[1]; });
    var labels=axes.map(function(a,i){
      var p=pt(i,maxR+22);
      var anchor = Math.abs(p[0]-cx)<4 ? "middle" : (p[0]>cx?"start":"end");
      return '<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="'+anchor+'" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#948A78">'+esc(a.name)+'</text>';
    }).join("");
    return '<svg viewBox="0 0 '+size+' '+size+'" class="radar-svg" role="img" aria-label="Edge score radar">'+
      rings+spokes+
      '<polygon points="'+dataPts.join(" ")+'" fill="rgba(79,143,209,.22)" stroke="#4F8FD1" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
      labels+'</svg>';
  }

  function balanceSection(){

  /* ---------------- views ---------------- */
  var VIEWS=[["daily","Daily"],["weekly","Weekly"],["monthly","Monthly"],["yearly","Yearly"],["ytd","YTD"],["all","All time"]];

  function windowKeys(v){
    var ds={}; state.trades.forEach(function(t){ ds[t.date]=1; });
    var dates=Object.keys(ds).sort();
    if(!dates.length) return [];
    if(v==="daily") return dates;
    if(v==="weekly"){ var w={}; dates.forEach(function(d){ w[mondayOf(d)]=1; }); return Object.keys(w).sort(); }
    if(v==="monthly"){ var m={}; dates.forEach(function(d){ m[d.slice(0,7)]=1; }); return Object.keys(m).sort(); }
    if(v==="yearly"){ var y={}; dates.forEach(function(d){ y[d.slice(0,4)]=1; }); return Object.keys(y).sort(); }
    return ["_"];
  }
  function windowOf(v,off){
    var keys=windowKeys(v); if(!keys.length) return null;
    var idx=Math.min(keys.length-1, Math.max(0, keys.length-1-off));
    var key=keys[idx], list, label, sub;
    if(v==="daily"){
      list=state.trades.filter(function(t){ return t.date===key; });
      label=new Date(key+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
      sub="trade";
    } else if(v==="weekly"){
      list=state.trades.filter(function(t){ return mondayOf(t.date)===key; });
      var s=new Date(key+"T00:00:00"), e=new Date(s); e.setDate(s.getDate()+6);
      label="Week of "+s.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" – "+e.toLocaleDateString(undefined,{month:"short",day:"numeric"});
      sub="day";
    } else if(v==="monthly"){
      list=state.trades.filter(function(t){ return t.date.slice(0,7)===key; });
      label=new Date(key+"-01T00:00:00").toLocaleDateString(undefined,{month:"long",year:"numeric"});
      sub="day";
    } else if(v==="yearly"){
      list=state.trades.filter(function(t){ return t.date.slice(0,4)===key; });
      label=key; sub="month";
    } else if(v==="ytd"){
      var yr=windowKeys("yearly").slice(-1)[0];
      list=state.trades.filter(function(t){ return t.date.slice(0,4)===yr; });
      label=yr+" to date"; key=yr; sub="month";
    } else {
      list=state.trades.slice();
      var dk=windowKeys("daily");
      label=dk.length>1 ? "All time · "+dk[0]+" → "+dk[dk.length-1] : "All time";
      sub=dk.length>60?"month":"day";
    }
    return { key:key, label:label, list:list, sub:sub, idx:idx, count:keys.length, single:(v==="ytd"||v==="all") };
  }
  function buckets(win){
    var out=[];
    if(win.sub==="trade"){
      win.list.slice().sort(function(a,b){ return n(a.tradeNo)-n(b.tradeNo); })
        .forEach(function(t,i){ out.push({ label:"Trade "+(has(t.tradeNo)?t.tradeNo:i+1), pts:pts(t) }); });
      return out;
    }
    var map={};
    win.list.forEach(function(t){
      var k = win.sub==="day" ? t.date : t.date.slice(0,7);
      map[k]=(map[k]||0)+pts(t);
    });
    return Object.keys(map).sort().map(function(k){
      var lab = win.sub==="day"
        ? new Date(k+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})
        : new Date(k+"-01T00:00:00").toLocaleDateString(undefined,{month:"short",year:"2-digit"});
      return { label:lab, pts:map[k] };
    });
  }
  function modeOf(list, field){
    var c={}, best=null;
    list.forEach(function(t){ if(has(t[field])){ c[t[field]]=(c[t[field]]||0)+1; } });
    Object.keys(c).forEach(function(k){ if(!best||c[k]>c[best]) best=k; });
    return best ? { name:best, n:c[best], of:Object.keys(c).length } : null;
  }
  function cleanPct(list){
    if(!list.length) return null;
    var clean=list.filter(function(t){ return String(t.ruleBroken||"").toUpperCase().indexOf("Y")!==0; }).length;
    return { pct:clean/list.length*100, clean:clean, broken:list.length-clean };
  }

      "</div></section>";

    h+=edgeScoreSection();
    h+=calendarSection();
    h+=balanceSection();

    h+='<section class="sect"><div class="eye">The open questions</div><h2>What\'s paying</h2>'+

      ' trades — not the window above, because a comparison needs sample size to mean anything. Points per trade, with R underneath. Under five trades a side is marked thin: a hint, not a result.</p>'+
      '<div class="score">';
    comparisons().forEach(function(c){
      var scale=Math.max(Math.abs(c.a.avg),Math.abs(c.b.avg),1);
      var thin=Math.min(c.a.n,c.b.n)<5, gap=c.a.avg-c.b.avg, lead=gap>=0?c.a:c.b;

    });

      "<h2>Breakdowns</h2>"+

  function heroChips(v,win,a,dayRec){
    var c="";
    if(v==="daily"){
      if(dayRec&&has(dayRec.dayType)) c+='<span class="chip"><b>'+esc(dayRec.dayType)+"</b></span>";
      if(dayRec&&has(dayRec.dayChar)) c+='<span class="chip"><b>'+esc(dayRec.dayChar)+"</b></span>";
      c+='<span class="chip">W/L <b>'+a.wins+"/"+a.losses+"</b></span>";
      var br=win.list.filter(function(t){ return String(t.ruleBroken||"").toUpperCase().indexOf("Y")===0; }).length;
      c+= br ? '<span class="chip"><b class="neg">'+br+" rule break"+(br>1?"s":"")+"</b></span>"
             : '<span class="chip">Rules <b>clean</b></span>';
      return c;
    }
    var cp=cleanPct(win.list);
    if(cp) c+='<span class="chip">Clean rules <b class="'+(cp.pct>=80?"pos":cp.pct>=60?"":"neg")+'">'+cp.pct.toFixed(0)+"%</b> ("+cp.clean+"/"+win.list.length+")</span>";
    var ch=modeOf(win.list,"dayChar");
    if(ch) c+='<span class="chip">Mostly <b>'+esc(ch.name)+"</b> ("+ch.n+" of "+win.list.length+")</span>";
    var dt=modeOf(win.list,"dayType");
    if(dt) c+='<span class="chip">Day type <b>'+esc(dt.name)+"</b> ("+dt.n+")</span>";
    c+='<span class="chip">W/L <b>'+a.wins+"/"+a.losses+"</b></span>";
    return c;
  }

  function groupCard(eye,title,field,list){
    var src=list||state.trades;
    var map={};
    src.forEach(function(t){ var k=has(t[field])?String(t[field]):"(blank)"; (map[k]=map[k]||[]).push(t); });
    var g=Object.keys(map).map(function(k){ var x=agg(map[k]); x.name=k; return x; })
      .sort(function(p,q){ return q.n-p.n; });
    var sc=Math.max.apply(null,g.map(function(x){return Math.abs(x.avg);}).concat([1]));
    var h='<div><div class="eye">'+esc(eye)+"</div><h3>"+esc(title)+'</h3><div class="card">';
    if(!g.length) h+='<div class="mono dimc">No trades in this window.</div>';
    g.forEach(function(d){
      h+='<div class="brow"><div class="blab">'+esc(d.name)+' <span style="opacity:.55">('+d.n+")</span></div>"+
        bar(d.avg,sc)+'<div class="bval '+cls(d.avg)+'">'+fmt(d.avg)+"</div></div>";
    });
    return h+"</div></div>";
  }
  /* Like groupCard, but keys are shown in a fixed, meaningful order (e.g. Mon..Sun,
     Trade 1..Trade N) rather than sorted by frequency. keyFn returns a key or null
     (null trades are dropped); order lists every key in display order. */
  function orderedCard(eye,title,list,keyFn,order){
    var src=list||state.trades;
    var map={};
    src.forEach(function(t){ var k=keyFn(t); if(k==null) return; (map[k]=map[k]||[]).push(t); });
    var g=order.map(function(k){ var x=agg(map[k]||[]); x.name=k; return x; })
      .filter(function(x){ return x.n>0; });
    var sc=Math.max.apply(null,g.map(function(x){return Math.abs(x.avg);}).concat([1]));
    var h='<div><div class="eye">'+esc(eye)+"</div><h3>"+esc(title)+'</h3><div class="card">';
    if(!g.length) h+='<div class="mono dimc">No trades in this window.</div>';
    g.forEach(function(d){
      h+='<div class="brow"><div class="blab">'+esc(d.name)+' <span style="opacity:.55">('+d.n+")</span></div>"+
        bar(d.avg,sc)+'<div class="bval '+cls(d.avg)+'">'+fmt(d.avg)+"</div></div>";
    });
    return h+"</div></div>";
  }

      '<div class="pills">'+[["daily","Daily"],["weekly","Weekly"],["monthly","Monthly"]].map(function(x){
        return '<button class="pill" data-on="'+(m===x[0]?1:0)+'" data-act="period" data-mode="'+x[0]+'">'+x[1]+"</button>"; }).join("")+"</div>";

    h+='<div class="scroll"><table><thead><tr><th>'+(m==="daily"?"Day":m==="weekly"?"Week of":"Month")+"</th>"+

      "<th class='right'>Trades</th><th class='right'>W/L</th><th class='right'>Win%</th>"+

      "<th class='right'>Best</th><th class='right'>Worst</th><th class='right'>Breaks</th>"+
      (m==="daily"?"<th>Budget</th>":"")+"</tr></thead><tbody>";
    P.slice().reverse().forEach(function(p){
      var over=p.n>3, overL=p.losses>2;
      h+='<tr><td class="mono" style="white-space:nowrap">'+esc(p.label)+"</td>"+
        (m!=="daily"?'<td class="mono right">'+p.days+"</td>":"")+
        '<td class="mono right">'+p.n+"</td>"+
        '<td class="mono right"><span class="pos">'+p.wins+'</span><span class="dimc">/</span><span class="neg">'+p.losses+"</span></td>"+
        '<td class="mono right">'+p.wr.toFixed(0)+"%</td>"+
        '<td style="min-width:110px">'+bar(p.pts,ns)+"</td>"+
        '<td class="mono right '+cls(p.pts)+'">'+fmt(p.pts)+"</td>"+
        '<td class="mono right '+cls(p.R)+'">'+fmt(p.R,2)+"</td>"+
        '<td class="mono right '+cls(p.avg)+'">'+fmt(p.avg)+"</td>"+
        '<td class="mono right pos">'+fmt(p.best)+"</td>"+
        '<td class="mono right '+cls(p.worst)+'">'+fmt(p.worst)+"</td>"+
        '<td class="mono right '+(p.broken?"neg":"dimc")+'">'+p.broken+"</td>"+
        (m==="daily"?'<td class="mono">'+(over||overL
          ? '<span class="neg">'+(over?"over count":"")+(over&&overL?" · ":"")+(overL?"over losses":"")+"</span>"
          : '<span class="dimc">held</span>')+"</td>":"")+"</tr>";
    });
    h+="</tbody></table></div>";
    if(m!=="daily") h+='<p class="lede">A '+(m==="weekly"?"week":"month")+" with fewer than about ten trades tells you more about variance than about the framework.</p>";
    return h+"</section>";
  }

          (has(d.dayType)?'<span class="tag">'+esc(d.dayType)+"</span>":"")+
          (has(d.dayChar)?'<span class="tag">'+esc(d.dayChar)+"</span>":"")+
          (has(d.atr)?'<span class="tag">ATR '+n(d.atr).toFixed(2)+"</span>":"")+
          (has(d.asianPctATR)?'<span class="tag">Asian '+(n(d.asianPctATR)*100).toFixed(0)+"% ATR</span>":"")+
          '<span class="tag">'+(has(d.tradesTaken)?esc(d.tradesTaken):"0")+" trades</span>"+
        "</div></div>"+
        '<div class="mono" style="font-size:24px" class="'+(p?cls(p.pts):"dimc")+'">'+
          '<span class="'+(p?cls(p.pts):"dimc")+'">'+(p?fmt(p.pts)+" pts":"—")+"</span>"+
          (p?'<div class="dv-sub" style="text-align:right">'+fmt(p.R,2)+"R</div>":"")+"</div></div>"+
        (has(d.notes)?'<div class="daynote">'+esc(d.notes)+"</div>":"")+"</div>";
    });
    return h+"</section>";
  }

  function viewTrades(){
    if(!state.trades.length) return noData();
    var h='<section class="sect"><div class="eye">Record</div><h2>Journal</h2>'+
      '<p class="lede">Every trade, newest first, with your reasoning attached. Add new ones from <button class="link" data-tab="addtrade">Add trade</button>.</p>'+
      '<div class="acts l"><button class="btn g" data-act="csv">Export CSV</button>'+
      '<button class="btn g" data-act="backupjson">Backup JSON</button>'+
      '<button class="btn g" data-act="backuppick">Import backup</button></div>';

    h+='<div class="jlist">';
    sorted().reverse().forEach(function(t){
      var tot=pts(t), broke=String(t.ruleBroken||"").toUpperCase().indexOf("Y")===0;
      var tags=Array.isArray(t.tags)?t.tags:[];
      h+='<div class="jcard"><div class="jc-head">'+
        '<span class="jc-pts '+cls(tot)+'">'+fmt(tot,1)+'</span>'+
        (has(t.resR)?'<span class="tag">'+fmt(n(t.resR),2)+'R</span>':'')+
        '<span class="dimc mono" style="font-size:11.5px">'+esc(t.date)+'</span>'+
        (has(t.direction)?'<span class="tag">'+esc(t.direction)+'</span>':'')+
        (has(t.session)?'<span class="tag">'+esc(t.session)+'</span>':'')+
        (has(t.setup)?'<span class="tag">'+esc(t.setup)+'</span>':'')+
        (broke?'<span class="tag bad">rule broken</span>':'')+
        tags.map(function(tg){ return '<span class="tag">'+esc(tg)+'</span>'; }).join('')+
        '</div>'+
        ((has(t.confluence)||has(t.notes)) ? '<div class="jc-why">'+
          (has(t.confluence)?'<b>'+esc(t.confluence)+'.</b> ':'')+esc(t.notes||"")+'</div>' : '')+
        '<div class="jc-foot">'+
          '<button class="link" data-act="tradeedit" data-trade-id="'+esc(t.id)+'">Edit</button>'+
          (state.confirmDeleteId===t.id
            ? '<button class="link warn" data-act="tradedelyes" data-trade-id="'+esc(t.id)+'">Confirm delete</button>'+
              '<button class="link" data-act="tradedelno">Cancel</button>'
            : '<button class="link warn" data-act="tradedelask" data-trade-id="'+esc(t.id)+'">Delete</button>')+
        '</div>'+
        '</div>';
    });
    h+='</div></section>';
    return h;
  }

  function viewData(){
    var h='<section class="sect"><div class="eye">Workbook</div><h2>Import and export</h2>'+
      '<p class="lede">The spreadsheet is the source of truth. Import reads the <b>Trade Log</b> and <b>Day Log</b> sheets by their column headers, so added columns and reordered ones are both fine — only renamed headers would break the match.</p>';

    h+='<div class="drop" id="drop"><h3>Drop your workbook here</h3>'+
      '<p>XAUUSD_Trading_Journal.xlsx, or any workbook with a Trade Log sheet. Nothing is uploaded anywhere — the file is read inside your browser.</p>'+
      '<button class="btn" data-act="pick">Choose file</button></div>';

    if(state.imported){
      h+='<div class="card"><h3 style="margin-top:0">Last import</h3>'+
        '<div class="mono" style="line-height:2;margin-top:8px">'+
        esc(state.imported.file)+"<br>"+
        state.imported.trades+" trades · "+state.imported.days+" day records"+
        (state.imported.skipped?' · <span class="neg">'+state.imported.skipped+" rows skipped (no valid date)</span>":"")+"<br>"+
        '<span class="dimc">Sheets seen: '+esc(state.imported.sheets)+"</span><br>"+
        '<span class="dimc">'+esc(state.imported.when)+"</span></div></div>";
    }

    h+='<div class="card"><h3 style="margin-top:0">Export</h3>'+
      '<p class="lede">The Excel export writes a Trade Log sheet with your exact column order, plus the Day Log. It carries data only — your formulas, formatting and the Dashboard and Framework tabs are not reproduced, so treat it as rows to paste into your workbook rather than a replacement for it.</p>'+
      '<div class="acts l"><button class="btn" data-act="xlsx">Download Excel</button>'+
      '<button class="btn g" data-act="csv">Download CSV</button>'+
      '<button class="btn g" data-act="copycsv">Copy CSV text</button></div></div>';

    h+='<div class="card"><h3 style="margin-top:0">Full backup (JSON)</h3>'+
      '<p class="lede">Unlike the Excel/CSV export, this round-trips everything — trades entered by hand, tags, and your Accounts settings — so it\'s the one to use for moving to a new browser or device.</p>'+
      '<div class="acts l"><button class="btn g" data-act="backupjson">Download backup</button>'+
      '<button class="btn g" data-act="backuppick">Restore from backup</button></div></div>';

    h+='<div class="card"><h3 style="margin-top:0">Stored copy</h3>'+
      '<p class="lede">The last import is kept in this browser so the dashboard still loads when you come back. Re-import after each trading day to refresh it. Phone and desktop keep separate copies.</p>';
    if(state.trades.length){
      h+= state.confirmClear
        ? '<div class="acts l"><button class="btn d" data-act="clearyes">Yes, clear it</button><button class="btn g" data-act="clearno">Keep it</button></div>'
        : '<div class="acts l"><button class="btn d" data-act="clear">Clear stored copy</button></div>';
    } else h+='<p class="lede dimc">Nothing stored.</p>';
    h+="</div></section>";
    return h;
  }

  /* ---------------- render ---------------- */
  function render(){
    var overlay=document.getElementById("lockOverlay");
    var shell=document.getElementById("appShell");
    if(state.pinLocked){
      shell.style.display="none";
      overlay.hidden=false; overlay.innerHTML=lockScreenHTML();
      wirePinFocus();
      return;
    }
    overlay.hidden=true; overlay.innerHTML=""; shell.style.display="";

    document.getElementById("clock").textContent =
      state.trades.length ? "Beirut UTC+3 · "+state.trades.length+" trades · "+state.days.length+" days"
                          : "Beirut UTC+3 · no journal loaded";
    document.getElementById("sideNav").innerHTML = NAV_ITEMS.map(function(t){
      return '<button class="side-item" data-tab="'+t[0]+'" data-on="'+(state.tab===t[0]?1:0)+'">'+t[1]+"</button>"; }).join("");
    var crumbLabel = (NAV_ITEMS.filter(function(t){ return t[0]===state.tab; })[0] || NAV_ITEMS[0])[1];
    document.getElementById("crumb").innerHTML = "Journal / <b>"+esc(crumbLabel)+"</b>";

    var b="";
    if(state.msg) b+='<div class="note '+state.msgKind+'"><span>'+esc(state.msg)+"</span>"+
      '<button class="link" data-act="dismiss">Dismiss</button></div>';
    document.getElementById("banners").innerHTML=b;

    document.getElementById("view").innerHTML =
      state.tab==="dashboard"?viewHome():
      state.tab==="breakdown"?viewBreakdown():
      state.tab==="journal"?viewTrades():
      state.tab==="data"?viewData():
      state.tab==="accounts"?viewAccounts():
      state.tab==="addtrade"?viewAddTrade():
      state.tab==="review"?viewReview():
      state.tab==="playbook"?viewPlaybook():
      state.tab==="certificates"?viewCertificates():
      viewExpenses();

    document.getElementById("foot").innerHTML =
      "Reads your workbook in the browser — nothing is uploaded. Stored copy lives in this browser only.<br>"+
      "Splits and period tables describe what has already happened. They do not forecast the next trade.";

    requestAnimationFrame(function(){
      Array.prototype.forEach.call(document.querySelectorAll("[data-w]"),function(el){
        el.style.width=el.getAttribute("data-w")+"%"; });
    });
    wireDrop();
  }

  function wireDrop(){
    var d=document.getElementById("drop");
    if(!d) return;
    ["dragenter","dragover"].forEach(function(ev){
      d.addEventListener(ev,function(e){ e.preventDefault(); d.classList.add("over"); }); });
    ["dragleave","drop"].forEach(function(ev){
      d.addEventListener(ev,function(e){ e.preventDefault(); d.classList.remove("over"); }); });
    d.addEventListener("drop",function(e){
      if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]) readWorkbook(e.dataTransfer.files[0]);
    });
  }

  /* ---------------- events ---------------- */
  document.getElementById("filepick").addEventListener("change",function(e){
    if(e.target.files&&e.target.files[0]) readWorkbook(e.target.files[0]);
    e.target.value="";
  });
  document.getElementById("backuppick").addEventListener("change",function(e){
    if(e.target.files&&e.target.files[0]) readBackup(e.target.files[0]);
    e.target.value="";
  });

  document.addEventListener("click",function(e){
   try{
    var tb=e.target.closest("[data-tab]");
    if(tb){ state.tab=tb.dataset.tab; state.msg=null; state.editingId=null; state.confirmDeleteId=null; render(); return; }
    var b=e.target.closest("[data-act]"); if(!b) return;
    var a=b.dataset.act;
    if(a==="period"){ state.period=b.dataset.mode; render(); }
    else if(a==="view"){ state.view=b.dataset.mode; state.offset=0; render(); }
    else if(a==="older"){ state.offset=state.offset+1; render(); }
    else if(a==="newer"){ state.offset=Math.max(0,state.offset-1); render(); }
    else if(a==="pick"){ document.getElementById("filepick").click(); }
    else if(a==="godata"){ state.tab="data"; render(); }
    else if(a==="dismiss"){ state.msg=null; render(); }
    else if(a==="xlsx"){ exportXlsx(); }
    else if(a==="csv"){ download("XAUUSD_Trade_Log.csv",csvText(),"text/csv"); }
    else if(a==="copycsv"){ copyText(csvText(),"CSV"); }
    else if(a==="clear"){ state.confirmClear=true; render(); }
    else if(a==="clearno"){ state.confirmClear=false; render(); }
    else if(a==="clearyes"){ state.confirmClear=false; state.trades=[]; state.days=[]; state.imported=null; persist(); }
    else if(a==="breaksub"){ state.breakdownSub=b.dataset.mode; render(); }
    else if(a==="calolder"){ state.calOffset=state.calOffset+1; render(); }
    else if(a==="calnewer"){ state.calOffset=Math.max(0,state.calOffset-1); render(); }
    else if(a==="accsave"){
      var accB=parseFloat((document.getElementById("accBal")||{}).value);
      var accP=parseFloat((document.getElementById("accPv")||{}).value);
      state.account={ startingBalance: isFinite(accB)?accB:0, pointValue: (isFinite(accP)&&accP!==0)?accP:1 };
      persistAccount();
      say("Account settings saved.","ok"); render();
    }
    else if(a==="addtrade"){
      var val=function(id){ var el=document.getElementById(id); return el?el.value:""; };
      var atDate=val("atDate"), atPtsV=val("atPts");
      if(!/^\d{4}-\d{2}-\d{2}$/.test(atDate)){ state.msg="Pick a date first."; state.msgKind="bad"; render(); return; }
      if(!has(atPtsV) || isNaN(parseFloat(atPtsV))){ state.msg="Enter a result in points."; state.msgKind="bad"; render(); return; }
      var tagsRaw = val("atTags");
      var tags = tagsRaw ? tagsRaw.split(",").map(function(s){ return s.trim(); }).filter(Boolean) : [];
      var fields = {
        date: atDate,
        session: val("atSession"), setup: val("atSetup"), direction: val("atDirection"),
        dayType: val("atDayType"), dayChar: val("atDayChar"),
        rsi: has(val("atRsi"))?n(val("atRsi")):null,
        entry1: has(val("atEntry"))?n(val("atEntry")):null,
        sl: has(val("atSl"))?n(val("atSl")):null,
        totalPts: n(atPtsV), res1: n(atPtsV),
        resR: has(val("atR"))?n(val("atR")):null,
        ruleBroken: (document.getElementById("atRule")||{}).checked ? "Y" : "N",
        confluence: val("atConfluence"), notes: val("atNotes"),
        tags: tags
      };
      if(state.editingId){
        var existing = state.trades.filter(function(t){ return t.id===state.editingId; })[0];
        if(existing) Object.keys(fields).forEach(function(k){ existing[k]=fields[k]; });
        state.editingId=null;
        say("Trade updated.","ok");
      } else {
        fields.id = "m"+Date.now()+Math.random().toString(36).slice(2,7);
        fields.tradeNo = state.trades.filter(function(t){ return t.date===atDate; }).length + 1;
        state.trades.push(fields);
        say("Trade logged.","ok");
      }
      state.tab="journal";
      persist();
    }
    else if(a==="tradeedit"){
      state.editingId=b.dataset.tradeId; state.confirmDeleteId=null; state.tab="addtrade"; render();
    }
    else if(a==="tradeeditcancel"){ state.editingId=null; state.tab="journal"; render(); }
    else if(a==="tradedelask"){ state.confirmDeleteId=b.dataset.tradeId; render(); }
    else if(a==="tradedelno"){ state.confirmDeleteId=null; render(); }
    else if(a==="tradedelyes"){
      state.trades = state.trades.filter(function(t){ return t.id!==b.dataset.tradeId; });
      state.confirmDeleteId=null;
      say("Trade deleted.","ok");
      persist();
    }
    else if(a==="backupjson"){ backupJSON(); }
    else if(a==="backuppick"){ document.getElementById("backuppick").click(); }
    else if(a==="revolder"){ state.reviewOffset=state.reviewOffset+1; render(); }
    else if(a==="revnewer"){ state.reviewOffset=Math.max(0,state.reviewOffset-1); render(); }
    else if(a==="revsave"){
      var weeksR=windowKeys("weekly");
      if(weeksR.length){
        var idxR=Math.min(weeksR.length-1, Math.max(0, weeksR.length-1-state.reviewOffset));
        var wkR=weeksR[idxR];
        state.reviews[wkR]={
          worked: (document.getElementById("revWorked")||{}).value||"",
          cut: (document.getElementById("revCut")||{}).value||"",
          focus: (document.getElementById("revFocus")||{}).value||"",
          savedAt: new Date().toISOString()
        };
        saveJSON(REV_KEY, state.reviews);
        say("Review saved.","ok");
      }
      render();
    }
    else if(a==="pbsave"){
      var pbTa=document.getElementById("pbNote_"+b.dataset.idx);
      state.playbookNotes[b.dataset.name]=pbTa?pbTa.value:"";
      saveJSON(PLAYBOOK_KEY, state.playbookNotes);
      say("Playbook notes saved.","ok"); render();
    }
    else if(a==="certadd"){
      var cDate=(document.getElementById("certDate")||{}).value;
      var cTitle=(document.getElementById("certTitle")||{}).value;
      if(!cDate || !cTitle){ state.msg="Add a date and a title."; state.msgKind="bad"; render(); return; }
      var cAmt=(document.getElementById("certAmount")||{}).value;
      state.certificates.push({
        id:"c"+Date.now()+Math.random().toString(36).slice(2,7),
        date:cDate, title:cTitle,
        amount: has(cAmt)?n(cAmt):null,
        note: (document.getElementById("certNote")||{}).value||""
      });
      saveJSON(CERT_KEY, state.certificates);
      say("Milestone added.","ok"); render();
    }
    else if(a==="certdel"){
      state.certificates=state.certificates.filter(function(c){ return c.id!==b.dataset.certId; });
      saveJSON(CERT_KEY, state.certificates);
      render();
    }
    else if(a==="expadd"){
      var eDate=(document.getElementById("expDate")||{}).value;
      var eAmt=(document.getElementById("expAmount")||{}).value;
      if(!eDate || !has(eAmt) || isNaN(parseFloat(eAmt))){ state.msg="Add a date and an amount."; state.msgKind="bad"; render(); return; }
      state.expenses.push({
        id:"e"+Date.now()+Math.random().toString(36).slice(2,7),
        date:eDate, category:(document.getElementById("expCat")||{}).value||"Other",
        amount:n(eAmt), note:(document.getElementById("expNote")||{}).value||""
      });
      saveJSON(EXP_KEY, state.expenses);
      say("Expense added.","ok"); render();
    }
    else if(a==="expdel"){
      state.expenses=state.expenses.filter(function(x){ return x.id!==b.dataset.expId; });
      saveJSON(EXP_KEY, state.expenses);
      render();
    }
    else if(a==="lock" || a==="signout"){
      sessionStorage.removeItem(UNLOCK_KEY);
      state.pinError=""; state.confirmPinReset=false;
      state.pinStage = localStorage.getItem(PIN_KEY) ? "gate" : "setup";
      state.pinLocked=true; render();
    }
    else if(a==="pinresetask"){ state.confirmPinReset=true; render(); }
    else if(a==="pinreset"){
      localStorage.removeItem(PIN_KEY);
      state.confirmPinReset=false; state.pinError=""; state.pinStage="setup"; render();
    }
    else if(a==="pinskip"){
      localStorage.setItem(PIN_SKIP_KEY,"1");
      sessionStorage.setItem(UNLOCK_KEY,"1");
      state.pinLocked=false; state.pinError=""; render();
    }
    else if(a==="pinsetupsave"){
      var p1=(document.getElementById("pinNew")||{}).value||"";
      var p2=(document.getElementById("pinConfirm")||{}).value||"";
      if(!/^\d{4,6}$/.test(p1)){ state.pinError="PIN must be 4–6 digits."; render(); return; }
      if(p1!==p2){ state.pinError="PINs don't match."; render(); return; }
      localStorage.setItem(PIN_KEY, simpleHash(p1));
      localStorage.removeItem(PIN_SKIP_KEY);
      sessionStorage.setItem(UNLOCK_KEY,"1");
      state.pinLocked=false; state.pinError=""; render();
    }
    else if(a==="pinunlock"){
      var pv=(document.getElementById("pinInput")||{}).value||"";
      if(simpleHash(pv)===localStorage.getItem(PIN_KEY)){
        sessionStorage.setItem(UNLOCK_KEY,"1");
        state.pinLocked=false; state.pinError=""; state.confirmPinReset=false; render();
      } else {
        state.pinError="Wrong PIN."; render();
        var el=document.getElementById("pinInput"); if(el) el.focus();
      }
    }
   }catch(err){
     state.msg="Error handling that click: "+(err&&err.message?err.message:err); state.msgKind="bad";
     try{ render(); }catch(e2){}
   }
  });

  document.addEventListener("keydown",function(e){
    if(e.key!=="Enter") return;
    var id=e.target && e.target.id;
    if(id==="pinInput"){ e.preventDefault(); var b1=document.querySelector('[data-act="pinunlock"]'); if(b1) b1.click(); }
    else if(id==="pinNew" || id==="pinConfirm"){ e.preventDefault(); var b2=document.querySelector('[data-act="pinsetupsave"]'); if(b2) b2.click(); }
  });

  window.addEventListener("error",function(ev){
    state.msg="Script error: "+(ev.message||"unknown"); state.msgKind="bad";
    try{ render(); }catch(e){}
  });

  load();
  loadAccount();
  loadExtras();
  computeLock();
  if(!state.pinLocked && !state.trades.length) state.tab="data";
  render();
})();
</script>
</body>
</html>
